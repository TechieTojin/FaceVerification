name: CI

# Deterministic CI: every job runs on a clean, pinned Ubuntu runner with its own virtualenv / node_modules.
# Nothing depends on a developer's .env, .venv, database or model cache:
#   * backend tests set their own isolated environment (backend/tests/conftest.py: temp SQLite DB,
#     generated encryption key, APP_ENV=test + the synthetic FakeProvider);
#   * the E2E backend (frontend/e2e/start-backend.mjs) uses its own throwaway database under .e2e/.
#
# Real-model tests (RUN_REAL_MODEL_TESTS=1: MediaPipe + MiniFASNet + ArcFace on face photos) are NOT run in CI.
# They need reference face images, which are biometric data and are deliberately never committed
# (test_assets/ is gitignored). Run them locally — see docs/V4_TEST_REPORT.md.

on:
  pull_request:
  push:
    branches: [master, "feature/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"
  NODE_VERSION: "24"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  backend:
    name: Backend + CLI tests (pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements_backend.txt
            backend/requirements_mediapipe.txt

      - name: System libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0t64

      - name: Install backend dependencies (.venv)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r backend/requirements_backend.txt
          .venv/bin/python -m pip install --no-deps -r backend/requirements_mediapipe.txt

      - name: Backend + CLI tests (fake provider, isolated DB)
        run: |
          set -o pipefail
          .venv/bin/python -m pytest backend/tests tests -q -ra -p no:cacheprovider 2>&1 | tee pytest-output.txt

      - name: Report pytest failure as an annotation
        if: failure()
        run: |
          # Annotations are visible without downloading the log; keep the tail of the real output.
          python - <<'EOF'
          lines = open("pytest-output.txt", encoding="utf-8", errors="replace").read().splitlines()[-60:]
          msg = "\n".join(lines).replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print(f"::error title=pytest output (last 60 lines)::{msg}")
          EOF

  frontend:
    name: Frontend + SDK (type-check, lint, unit tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npx oxlint src

      - name: Unit tests (Vitest)
        working-directory: frontend
        run: npm test

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: TypeScript SDK (type-check + tests; Node 24 runs the TypeScript sources directly)
        working-directory: sdk/typescript
        run: |
          ../../frontend/node_modules/.bin/tsc -p tsconfig.json --noEmit
          node --test test/sdk.test.ts

  e2e:
    name: Playwright end-to-end (Chromium, deterministic)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements_backend.txt
            backend/requirements_mediapipe.txt

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: System libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0t64

      - name: Install backend dependencies (.venv)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r backend/requirements_backend.txt
          .venv/bin/python -m pip install --no-deps -r backend/requirements_mediapipe.txt

      - name: Fetch the face-landmarker model (checksum-verified; never committed)
        run: .venv/bin/python scripts/fetch_models.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium and its system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright tests
        working-directory: frontend
        env:
          PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload screenshots and traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
